name: LemonTextDemo
options:
  bundleIdPrefix: com.geramyloveless.LemonSeedStudio
  deploymentTarget:
    iOS: "26.2"
  createIntermediateGroups: true
packages:
  LemonText:
    path: ..
targets:
  LemonTextDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Samples
        type: folder
        buildPhase: resources
    dependencies:
      - package: LemonText
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geramyloveless.LemonSeedStudio.LemonTextDemo
        PRODUCT_NAME: LemonTextDemo
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LemonText
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - LemonTextDemoUITests
  LemonTextDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LemonTextDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geramyloveless.LemonSeedStudio.LemonTextDemoUITests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LemonTextDemo
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
